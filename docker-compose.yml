version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oepnv_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/oepnv_wien
      - REDIS_URL=redis://redis:6379/0
      - OTP_BASE_URL=http://otp:8080/otp
      - REALTIME_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - oepnv-net

  otp:
    image: docker.io/opentripplanner/opentripplanner:2.5.0
    container_name: oepnv_otp
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: ["--serve", "/var/opentripplanner"]
    volumes:
      - ./otp-data:/var/opentripplanner
    networks:
      - oepnv-net

  realtime-adapter:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oepnv_realtime_adapter
    restart: unless-stopped
    command: ["python", "-m", "app.services.realtime.realtime_adapter"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/oepnv_wien
    depends_on:
      - redis
      - postgres
    networks:
      - oepnv-net

  postgres:
    image: postgis/postgis:16-3.4
    container_name: oepnv_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=oepnv_wien
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oepnv_wien"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oepnv-net

  redis:
    image: redis:7-alpine
    container_name: oepnv_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - oepnv-net

volumes:
  postgres_data:
  redis_data:

networks:
  oepnv-net:
    driver: bridge

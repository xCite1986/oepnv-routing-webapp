[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# ÖBB Scotty Gateway Reverse Proxy (ermöglicht Live-Haltestellen auf Netlify ohne CORS)
[[redirects]]
  from = "/api/scotty/*"
  to = "https://fahrplan.oebb.at/:splat"
  status = 200
  force = true

# Photon OSM Geocoding Reverse Proxy (ermöglicht Adresssuche auf Netlify)
[[redirects]]
  from = "/api/photon/*"
  to = "https://photon.komoot.io/:splat"
  status = 200
  force = true

# Wiener Linien OGD Realtime Reverse Proxy (ermöglicht Echtzeit-Monitor auf Netlify ohne CORS)
[[redirects]]
  from = "/api/wl/*"
  to = "https://www.wienerlinien.at/ogd_realtime/:splat"
  status = 200
  force = true

# SPA Catch-All für React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
